<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS | Notifications</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 250px;
            background: #0f1624;
            border-right: 1px solid #202b3d;
            padding: 24px 16px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 35px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            font-weight: bold;
        }

        .nav-label {
            font-size: 11px;
            color: #64748b;
            margin: 25px 12px 10px;
            letter-spacing: 1px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            margin-bottom: 5px;
            border-radius: 9px;
            color: #94a3b8;
            text-decoration: none;
            transition: .2s;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #1b2639;
            color: #ffffff;
        }

        .nav-item span:first-child {
            width: 20px;
            text-align: center;
        }

        .notification-count {
            margin-left: auto;
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            border-radius: 20px;
            display: grid;
            place-items: center;
            background: #ef4444;
            color: white;
            font-size: 11px;
            font-weight: bold;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
        }

        .topbar {
            height: 70px;
            border-bottom: 1px solid #202b3d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: #0b111c;
        }

        .topbar h2 {
            font-size: 18px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            font-weight: bold;
        }

        .content {
            max-width: 1000px;
            margin: auto;
            padding: 40px 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-header p {
            color: #64748b;
        }

        button {
            border: none;
            cursor: pointer;
            font: inherit;
        }

        .mark-all-btn,
        .refresh-btn {
            padding: 11px 16px;
            border-radius: 8px;
            background: #1d4ed8;
            color: white;
            font-weight: 600;
        }

        .refresh-btn {
            background: #172033;
            border: 1px solid #29364d;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        /* =========================
           NOTIFICATIONS
        ========================= */

        .notification-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            padding: 20px;
            border: 1px solid #202b3d;
            border-radius: 14px;
            background: #111927;
            transition: .2s;
        }

        .notification:hover {
            border-color: #334155;
            transform: translateY(-1px);
        }

        .notification.unread {
            background: #141e31;
            border-color: #263d68;
        }

        .notification-icon {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: #1d4ed8;
            font-size: 19px;
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .notification-message {
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .notification-time {
            color: #64748b;
            font-size: 12px;
        }

        .read-btn {
            padding: 7px 10px;
            border-radius: 7px;
            background: #182337;
            color: #93c5fd;
            font-size: 12px;
        }

        .read-btn:hover {
            background: #243451;
        }

        .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22d3ee;
            margin-top: 8px;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            border: 1px dashed #29364d;
            border-radius: 16px;
            background: #0f1725;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #64748b;
        }

        .loading {
            text-align: center;
            color: #64748b;
            padding: 50px;
        }

        .error {
            padding: 18px;
            border-radius: 10px;
            background: #3b1515;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .sidebar {
                width: 75px;
                padding: 20px 10px;
            }

            .brand span,
            .nav-item:not(.active) {
                font-size: 0;
            }

            .nav-item span:first-child {
                font-size: 18px;
            }

            .main {
                margin-left: 75px;
                width: calc(100% - 75px);
            }

            .topbar {
                padding: 0 18px;
            }

            .content {
                padding: 25px 15px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .notification {
                padding: 15px;
            }
        }

        .notification[data-target]:hover {
            cursor: pointer;
            border-color: #334155;
        }

        .notification[data-target]:focus-visible {
            outline: 2px solid #60a5fa;
            outline-offset: 3px;
        }

    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">N</div>
            <span>NEXUS</span>
        </div>

        <nav>

            <div class="nav-label">MAIN</div>

            <a href="/" class="nav-item">
                <span>⌂</span>
                Dashboard
            </a>

            <a href="/communities.html" class="nav-item">
                <span>◎</span>
                Communities
            </a>

            <a href="/projects.html" class="nav-item">
                <span>▣</span>
                Projects
            </a>

            <a href="/chat.html" class="nav-item">
                <span>◫</span>
                Messages
            </a>

            <div class="nav-label">PERSONAL</div>

            <a href="/notifications.html"
               class="nav-item active">

                <span>♢</span>
                Notifications

                <span
                    id="navNotificationCount"
                    class="notification-count"
                    style="display:none;">
                </span>

            </a>

        </nav>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <h2>Notifications</h2>

            <div class="topbar-right">
                <div class="avatar">S</div>
            </div>

        </header>


        <section class="content">

            <div class="page-header">

                <div>
                    <h1>Notifications</h1>

                    <p>
                        Stay updated with activity across NEXUS.
                    </p>
                </div>

                <div class="actions">

                    <button
                        id="refreshBtn"
                        class="refresh-btn">
                        ↻ Refresh
                    </button>

                    <button
                        id="markAllBtn"
                        class="mark-all-btn">
                        Mark all as read
                    </button>

                </div>

            </div>


            <div
                id="notificationList"
                class="notification-list">

                <div class="loading">
                    Loading notifications...
                </div>

            </div>

        </section>

    </main>

</div>


<script src="socket.io/socket.io.js"></script>
<script src="js/notifications.js"></script>

</body>
</html>
