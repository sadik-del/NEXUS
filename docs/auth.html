<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS | Authentication</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo h1 {
            font-size: 32px;
            margin: 0;
            color: #ffffff;
        }

        .auth-logo p {
            color: #94a3b8;
            margin-top: 8px;
        }

        .auth-tabs {
            display: flex;
            gap: 8px;
            background: #0f172a;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .auth-tab {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
        }

        .auth-tab.active {
            background: #2563eb;
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border-radius: 9px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .auth-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .auth-button:hover {
            background: #1d4ed8;
        }

        .auth-message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <h1>NEXUS</h1>
                <p>Community & Collaboration Platform</p>
            </div>

            <!-- Tabs -->

            <div class="auth-tabs">

                <button class="auth-tab active" onclick="showForm('login')">
                    Login
                </button>

                <button class="auth-tab" onclick="showForm('register')">
                    Register
                </button>

            </div>

            <!-- LOGIN -->

            <form id="loginForm" class="auth-form active">

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button type="submit" class="auth-button">
                    Login to NEXUS
                </button>

                <div id="loginMessage" class="auth-message"></div>

            </form>

            <!-- REGISTER -->

            <form id="registerForm" class="auth-form">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Username</label>

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Choose a username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 6 characters"
                        required
                    >

                </div>

                <button type="submit" class="auth-button">
                    Create Account
                </button>

                <div id="registerMessage" class="auth-message"></div>

            </form>

            <a href="/" class="back-link">
                ← Back to NEXUS
            </a>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
